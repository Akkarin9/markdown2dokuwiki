server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Asset con hash nel nome: cache lunga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html e service worker mai in cache (per non servire build vecchie).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Manifest PWA: cache breve.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Applicazione single-page: qualunque percorso non trovato ricade su index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le conversioni avvengono nel browser: nessuna API, nessun proxy.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
